[package]
name = "offenback"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
claxon = "0.4.3"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
hound = "3.5.1"
midir = "0.11.1"
ratatui = "0.30.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[features]
default = ["pipewire"]
# Native PipeWire output (needs libpipewire-0.3-dev + libclang-dev). Without it cpal uses ALSA.
pipewire = ["cpal/pipewire"]

[profile.release]
debug = 1

# Optimize dependencies (FLAC decoding) even in debug builds: loading is 5-10x faster.
[profile.dev.package."*"]
opt-level = 3
